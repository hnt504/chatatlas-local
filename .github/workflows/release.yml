name: Release

# Push a tag like v0.1.0: the tests run, the Claude Desktop extension is built and attached to a
# GitHub release, and, if an NPM_TOKEN secret is set, the package is published to npm. Adding the
# secret later? Re-run this workflow from the Actions tab and it publishes.

on:
  push:
    tags: ['v*']
  # Publishing a release on GitHub's website (with a new v… tag) starts it too.
  release:
    types: [published]

# A tag pushed and its release published can both start this; one run at a time per tag.
concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run pack:mcpb
      - name: GitHub release with the extension
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-running this workflow (say, after adding NPM_TOKEN) updates the release instead of failing.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.mcpb --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.mcpb --title "ChatAtlas Local ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
          fi
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "chatatlas-local@$v" version >/dev/null 2>&1; then
            echo "chatatlas-local@$v is already on npm."
          else
            npm publish --provenance --access public
          fi
