name: Release

# Publish a release on GitHub (Releases → Draft a new release, new tag v<version>), or run
# `gh release create v<version>`: the tests run, the Claude Desktop extension is built and attached
# to the release, and the package is published to npm.
#
# npm publishing uses npm's trusted publishing: npmjs.com → chatatlas-local → Settings → Trusted
# publisher → GitHub Actions, hnt504/chatatlas-local, workflow release.yml. No token is stored.
# (An NPM_TOKEN secret still works if it's set, but npm stops accepting tokens that skip 2FA for
# publishing in January 2027.) Re-running this workflow is safe: a version already on npm is left
# alone and the release's extension is replaced.
#
# Only a published release starts it (it used to start on the tag too, so one release ran twice).

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # npm 11.5.1 or newer for trusted publishing; Node 24 comes with it.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run pack:mcpb
      - name: GitHub release with the extension
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-running this workflow updates the release instead of failing.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.mcpb --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.mcpb --title "ChatAtlas Local ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
          fi
      - name: Publish to npm
        env:
          # Empty unless the secret is set; then npm uses trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "chatatlas-local@$v" version >/dev/null 2>&1; then
            echo "chatatlas-local@$v is already on npm."
          else
            npm publish --provenance --access public
          fi
